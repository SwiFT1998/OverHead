<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico OverHead</title>
<style>
  body{ font-family: -apple-system, sans-serif; background:#111; color:#eee; padding:16px; line-height:1.5; }
  h1{ font-size:18px; }
  button{ display:block; width:100%; padding:14px; margin:10px 0; font-size:16px; border-radius:8px; border:1px solid #444; background:#222; color:#fff; }
  pre{ background:#000; border:1px solid #333; padding:12px; border-radius:8px; white-space:pre-wrap; word-break:break-word; font-size:13px; }
  .label{ color:#8ab; font-weight:bold; margin-top:16px; }
</style>
</head>
<body>

<h1>Diagnóstico OverHead</h1>

<div class="label">Ambiente (automático):</div>
<pre id="envOut">a carregar…</pre>

<button id="btnLoc">1. Testar localização</button>
<pre id="locOut">(ainda não testado)</pre>

<button id="btnSky">2. Testar ligação à OpenSky (anónimo, sem conta)</button>
<pre id="skyOut">(ainda não testado)</pre>

<script>
  const envOut = document.getElementById('envOut');
  const locOut = document.getElementById('locOut');
  const skyOut = document.getElementById('skyOut');

  function envInfo(){
    return [
      'URL: ' + location.href,
      'Protocolo: ' + location.protocol,
      'isSecureContext: ' + window.isSecureContext,
      'Modo standalone (iOS, ecrã principal): ' + (window.navigator.standalone === true),
      'display-mode standalone (geral): ' + (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches),
      'User-Agent: ' + navigator.userAgent,
      'geolocation existe: ' + ('geolocation' in navigator),
      'Notification existe: ' + ('Notification' in window),
      'Notification.permission: ' + (('Notification' in window) ? Notification.permission : 'n/a')
    ].join('\n');
  }
  envOut.textContent = envInfo();

  document.getElementById('btnLoc').addEventListener('click', () => {
    locOut.textContent = 'a pedir localização…';
    if (!('geolocation' in navigator)){
      locOut.textContent = 'ERRO: este browser não tem navigator.geolocation.';
      return;
    }
    const t0 = Date.now();
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const dt = Date.now() - t0;
        locOut.textContent =
          'SUCESSO em ' + dt + 'ms\n' +
          'lat: ' + pos.coords.latitude + '\n' +
          'lon: ' + pos.coords.longitude + '\n' +
          'precisão: ' + pos.coords.accuracy + ' m';
      },
      (err) => {
        const dt = Date.now() - t0;
        locOut.textContent =
          'ERRO em ' + dt + 'ms\n' +
          'code: ' + err.code + ' (1=PERMISSION_DENIED, 2=POSITION_UNAVAILABLE, 3=TIMEOUT)\n' +
          'message: ' + err.message;
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  });

  document.getElementById('btnSky').addEventListener('click', async () => {
    skyOut.textContent = 'a contactar a OpenSky…';
    const url = 'https://opensky-network.org/api/states/all?lamin=38.5&lomin=-9.5&lamax=39.0&lomax=-9.0';
    const t0 = Date.now();
    try{
      const res = await fetch(url);
      const dt = Date.now() - t0;
      const text = await res.text();
      skyOut.textContent =
        'Resposta recebida em ' + dt + 'ms\n' +
        'status: ' + res.status + ' ' + res.statusText + '\n' +
        'x-rate-limit-remaining: ' + res.headers.get('x-rate-limit-remaining') + '\n' +
        'tamanho da resposta: ' + text.length + ' caracteres\n' +
        'início da resposta: ' + text.slice(0, 200);
    } catch (e){
      const dt = Date.now() - t0;
      skyOut.textContent =
        'ERRO (falha de fetch) em ' + dt + 'ms\n' +
        'nome: ' + e.name + '\n' +
        'mensagem: ' + e.message;
    }
  });
</script>

</body>
</html>
